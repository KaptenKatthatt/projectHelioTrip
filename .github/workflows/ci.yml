name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "api/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "scripts/**"
      - "src/**"
      - "vite.config.ts"
      - "vitest.config.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "api/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "scripts/**"
      - "src/**"
      - "vite.config.ts"
      - "vitest.config.ts"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_SITE_URL: https://heliotrip-ci.invalid

      - name: Check bundle-size budgets
        run: npm run size:check

      - name: Check texture variants are in sync
        run: npm run textures:variants:check

      - name: Fallow report
        run: npm run fallow
        continue-on-error: true

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    # Use Playwright's official image to avoid repeated browser/system dependency installs.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm run test:e2e
